<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Provide Clarification — Parashar Jyotisha</title><style>
:root{--maroon:#8b1e2d;--line:#ead7b8;--ink:#2d241d;--muted:#7b6a5b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f4e5cb,#fffaf0 48%,#f7efe3);color:var(--ink);font:15px/1.6 Arial,sans-serif}.card{width:min(700px,100%);background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 20px 60px rgba(91,57,29,.13)}.brand{font:28px Georgia,serif;color:var(--maroon);margin-bottom:7px}.sub{color:var(--muted);margin:0 0 20px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8b684c;font-weight:800;margin-bottom:6px}.textarea{width:100%;min-height:190px;resize:vertical;border:1px solid #d9bd96;border-radius:12px;background:#fffaf3;padding:13px;font:inherit;outline:none}.textarea:focus{border-color:#b87843;box-shadow:0 0 0 3px rgba(184,120,67,.12)}.btn{margin-top:14px;width:100%;border:0;border-radius:11px;padding:13px 18px;background:var(--maroon);color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.msg{padding:12px;border-radius:10px;margin:12px 0}.ok{background:#e4f3e9;color:#285d3c;border:1px solid #b9dec6}.err{background:#f9e5e5;color:#862a2a;border:1px solid #efbebe}.note{font-size:12px;color:var(--muted);margin-top:12px}
</style></head><body><main class="card"><div class="brand">Parashar Jyotisha</div><p class="sub">Secure consultation clarification</p><div id="msg"></div><form id="form"><div class="label">Your clarification / additional information</div><textarea id="response" class="textarea" maxlength="4000" required placeholder="Please provide the information requested in the email. Do not include passwords, OTPs or bank details."></textarea><button id="sendBtn" class="btn" type="submit">Submit clarification securely</button></form><p class="note">This is a one-time link. After successful submission it cannot be reused.</p></main><script>
const FN="https://asia-south2-vedicpanchangaapp.cloudfunctions.net/submitConsultationClarification";const params=new URLSearchParams(location.search),token=(params.get("token")||"").trim(),form=document.getElementById("form"),msg=document.getElementById("msg"),sendBtn=document.getElementById("sendBtn");function show(t,type){msg.innerHTML=`<div class="msg ${type}">${String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}</div>`}if(!/^[a-f0-9]{64}$/i.test(token)){show("This clarification link is invalid or incomplete.","err");form.style.display="none"}form.addEventListener("submit",async e=>{e.preventDefault();const text=document.getElementById("response").value.trim();if(text.length<5){show("Please provide enough information for us to continue the consultation.","err");return}sendBtn.disabled=true;try{const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,response:text})});const j=await r.json().catch(()=>({ok:false,message:`HTTP ${r.status}`}));if(!r.ok||!j.ok)throw new Error(j.message||"Submission failed");show(`Thank you. Your clarification for ${j.refId||"this consultation"} has been received. Review has resumed.`,"ok");form.style.display="none";history.replaceState(null,"",location.pathname)}catch(err){show(err.message||String(err),"err");sendBtn.disabled=false}});
</script></body></html>
